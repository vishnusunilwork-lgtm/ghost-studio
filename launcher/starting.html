<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ghost Studio · starting</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%2326262e%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230e0e12%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2260%22%20height%3D%2260%22%20rx%3D%2214%22%20fill%3D%22url%28%23g%29%22/%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23f2f4f8%22%20stroke-width%3D%223%22%3E%3Cellipse%20cx%3D%2232%22%20cy%3D%2232%22%20rx%3D%2222%22%20ry%3D%2211%22%20transform%3D%22rotate%28-32%2032%2032%29%22/%3E%3Cellipse%20cx%3D%2232%22%20cy%3D%2232%22%20rx%3D%2222%22%20ry%3D%2211%22%20transform%3D%22rotate%2838%2032%2032%29%22%20opacity%3D%22.45%22/%3E%3C/g%3E%3Ccircle%20cx%3D%2237.4%22%20cy%3D%2228.7%22%20r%3D%224.6%22%20fill%3D%22%23f5f7fc%22/%3E%3C/svg%3E">
<style>
:root{--bg:#0a0a0b;--ink:#ededee;--mute:#9a9aa1;--edge:rgba(255,255,255,.12);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(circle at 50% 40%,#16181f,var(--bg) 60%);color:var(--ink);font:15px/1.6 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:0 16px}
.card{width:min(440px,100%);padding:34px 30px;border-radius:26px;background:rgba(30,30,36,.42);border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 30px 90px -30px rgba(0,0,0,.9);
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);text-align:center}
svg{width:64px;height:64px;color:var(--ink)}
.spin g{transform-origin:13px 13px;animation:o 2.4s linear infinite}
@keyframes o{to{transform:rotate(360deg)}}
h1{font-size:22px;font-weight:600;margin:16px 0 4px;letter-spacing:-.01em}
p{color:var(--mute);margin:0}
.tip{margin-top:18px;font-size:13px;min-height:42px;transition:opacity .4s}
.bar{height:3px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:22px}
.bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,#e8f1ff,transparent);animation:s 1.6s ease-in-out infinite}
@keyframes s{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
@media(prefers-reduced-motion:reduce){.spin g,.bar i{animation:none}}
</style>
</head>
<body>
<div class="card">
  <canvas id="mark" aria-hidden="true" style="display:block;margin:-18px auto -10px"></canvas>
  <h1 id="h">Starting Ghost Studio…</h1>
  <p id="sub">This page opens the app by itself as soon as it's ready.</p>
  <div class="bar"><i></i></div>
  <p class="tip" id="tip">The very first time, it sets itself up. That takes about 5 minutes.</p>
</div>
<script>
/* Ghost mark: glowing dots drift in from a soft cloud and settle into the Ghost logo
   (two orbits + nucleus), then breathe gently. Usage: ghostMark(canvasElement, sizeInPx) */
window.ghostMark = function (cv, size) {
  size = size || 120;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var dpr = Math.min(2, window.devicePixelRatio || 1), W = size * 1.6;
  cv.width = W * dpr; cv.height = W * dpr; cv.style.width = cv.style.height = W + 'px';
  var x = cv.getContext('2d'); x.scale(dpr, dpr);
  var c = W / 2, R = size * 0.404, r = size * 0.2, pts = [], TAU = Math.PI * 2;
  function orbit(deg, n, a, big) {
    var rot = deg * Math.PI / 180, cs = Math.cos(rot), sn = Math.sin(rot);
    for (var i = 0; i < n; i++) {
      var t = i / n * TAU, ex = R * Math.cos(t), ey = r * Math.sin(t);
      pts.push({ tx: c + ex * cs - ey * sn, ty: c + ex * sn + ey * cs, a: a, s: big ? 1.15 : 0.95 });
    }
  }
  orbit(-32, 96, 1, true);
  orbit(38, 74, 0.42, false);
  var nx = c + size * 0.1, ny = c - size * 0.062, nr = size * 0.081;
  for (var k = 0; k < 46; k++) {
    var an = Math.random() * TAU, d = Math.sqrt(Math.random()) * nr;
    pts.push({ tx: nx + Math.cos(an) * d, ty: ny + Math.sin(an) * d, a: 1, s: 1.25, nuc: 1 });
  }
  pts.forEach(function (p) {
    var an = Math.random() * TAU, d = size * (0.55 + Math.random() * 0.35);
    p.sx = c + Math.cos(an) * d; p.sy = c + Math.sin(an) * d;
    p.delay = Math.random() * 1.1 + (p.nuc ? 0.9 : 0);
    p.ph = Math.random() * TAU; p.sp = 0.6 + Math.random() * 0.8;
  });
  var t0 = performance.now(), alive = true;
  function ease(k) { return 1 - Math.pow(1 - k, 3); }
  function frame(now) {
    if (!alive || !cv.isConnected) return;
    var t = reduce ? 99 : (now - t0) / 1000;
    x.clearRect(0, 0, W, W);
    // soft halo that grows as the logo forms
    var form = Math.min(1, Math.max(0, (t - 0.6) / 2.2));
    var breathe = 0.5 + 0.5 * Math.sin(t * 1.3);
    var g = x.createRadialGradient(c, c, 0, c, c, size * 0.75);
    g.addColorStop(0, 'rgba(170,210,255,' + (0.10 + 0.07 * breathe) * form + ')');
    g.addColorStop(1, 'rgba(170,210,255,0)');
    x.fillStyle = g; x.fillRect(0, 0, W, W);
    x.shadowColor = 'rgba(205,230,255,.9)';
    for (var i = 0; i < pts.length; i++) {
      var p = pts[i];
      var k = Math.min(1, Math.max(0, (t - p.delay) / 2.0)); k = ease(k);
      var drift = (1 - k) * size * 0.05, wob = size * 0.006 * Math.sin(t * p.sp + p.ph) * (0.4 + 0.6 * breathe);
      var px = p.sx + (p.tx - p.sx) * k + Math.cos(t * 0.7 + p.ph) * drift + wob;
      var py = p.sy + (p.ty - p.sy) * k + Math.sin(t * 0.9 + p.ph) * drift + wob * 0.6;
      var al = p.a * (0.25 + 0.75 * k) * (0.85 + 0.15 * Math.sin(t * 2 + p.ph));
      x.shadowBlur = 6 + 6 * k * breathe;
      x.fillStyle = 'rgba(240,246,255,' + al + ')';
      x.beginPath(); x.arc(px, py, p.s * (0.8 + 0.4 * k), 0, TAU); x.fill();
    }
    x.shadowBlur = 0;
    if (!reduce) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  return { stop: function () { alive = false; } };
};

ghostMark(document.getElementById("mark"),110);
const URL_APP='http://localhost:7860/';
const tips=['The very first time, it sets itself up. That takes about 5 minutes.','After this, opening Ghost Studio takes a few seconds.','Updates arrive by themselves: click “Update now” when you see it.','Your ads stay on this computer. Nothing is uploaded.'];
let i=0;setInterval(()=>{const t=document.getElementById('tip');t.style.opacity=0;setTimeout(()=>{i=(i+1)%tips.length;t.textContent=tips[i];t.style.opacity=1},400)},6000);
let done=false;const go=()=>{if(!done){done=true;location.replace(URL_APP)}};
function probe(){if(done)return;const img=new Image();img.onload=go;img.src=URL_APP+'static/ping.png?'+Date.now();
  try{fetch(URL_APP+'api/status',{mode:'no-cors',cache:'no-store'}).then(go,()=>{})}catch(e){}}
probe();setInterval(probe,1500);
const t0=Date.now();setInterval(()=>{if(!done&&Date.now()-t0>12*60*1000){document.getElementById('h').textContent='Taking longer than usual';document.getElementById('sub').textContent='Check your internet, then open Ghost Studio again from its icon. Still stuck? Tell Vishnu.'}},5000);
</script>
</body>
</html>
