# Ghost Studio - settings
# Everything runs on this computer. No accounts needed; a video-service key is optional.
# Change a model here, restart the app, and it is used from then on.

engine: auto            # auto = best maker this computer has (see app/engines.py). "mock" = test media only

brand:
  name: ShareChat
  spoken: ShareChat
  about: "ShareChat lets people share devotional greetings, mantras and wishes with their own photo and name, in their own language."

language: Hindi

models:
  # Understands you (Talk to Ghost), writes scripts and every prompt, translates (Ollama). If this one isn't
  # downloaded, Ghost uses the newest installed model automatically.
  llm: qwen3.5:9b
  # Looks at reference-ad frames and checks pictures (Ollama)
  vision: qwen3-vl:8b
  # First-frame images (Hugging Face, diffusers)
  image: black-forest-labs/FLUX.2-klein-base-4B   # Apache 2.0 (the 9B is non-commercial)
  # AI-made videos must be labelled as AI-generated.
  # Image AI on Macs (free, optional: install it under the gear). Distilled = only 4 steps. Apache 2.0
  image_mac: black-forest-labs/FLUX.2-klein-4B
  # Mac built-in narrator voice. Empty = pick by language (Hindi: Lekha). Add voices in
  # System Settings > Accessibility > Spoken Content > System voice > Manage voices
  mac_voice: ""
  # Speech to text for reference ads and dubbing (faster-whisper)
  whisper: medium

quality:
  # Generated at this size, then upscaled to 1080x1920 for export
  video_width: 576
  video_height: 1024
  fps: 24
  image_steps: 50
  image_steps_mac: 4
  best_long_side: 1344     # Best pictures size (long side, pixels)
  mac_quantize: 8          # Apple chips: 8-bit = faster, same look. 0 = full precision
  # Draft mode: quick low-res preview to check the idea, then "Make it final" re-renders the same takes
  image_steps_draft: 20
  export_crf: 16          # lower = better quality, bigger file (16 is visually lossless)
  clip_seconds: 7.5       # longest line per clip

# OPTIONAL video service. Leave empty = free photo-motion ads on any computer.
# Add the key in the app (gear icon); it is saved in config.local.yaml on this computer only.
api:
  video_model: fal-ai/veo3.1/lite/image-to-video   # Veo 3.1 Lite: video + speech, ~US$0.05 per second at 720p
  image_model: fal-ai/flux-2/klein/4b
  resolution: 720p
  price_per_second: 0.05
  monthly_limit_usd: 20

paths:
  projects: projects
